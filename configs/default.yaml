# Single source of truth for all modules. No hardcoded values elsewhere.
# Paths are relative to the repo root.

seed: 0

paths:
  raw: data/raw                 # downloaded SoccerTrack v2 (gsr/ + bas/), never committed
  processed: data/processed     # {train,val,test}.pt in the Core data contract
  outputs: outputs              # checkpoints, logits, flops.json, thresholds.json
  results_csv: outputs/results.csv

data:
  fps: 25                       # M1: verify against the raw dataset and correct if needed
  window_seconds: 2.0           # chosen 2026-10-12: raw pitch coords sit on a ~1 m grid, so 0.5 s windows show
                                # almost no motion (val bal_acc 0.53); 2.0 s gives ~58% action windows and 0.58+
  stride_seconds: 0.5           # sliding: a decision every 0.5 s in the streaming scenario (windows overlap)
  max_people: 23                # P in the data contract: 22 players + 1 referee slot; pad/mask the rest
  num_classes: 2                # 0 = no action, 1 = action
  event_tolerance_frames: 0     # M1: tolerance for events at window edges
  splits:                       # official SoccerTrack v2 match split
    train: [M1, M3, M4, M5, M6, M8]
    val:   [M2, M10]
    test:  [M7, M9]

model:
  num_exits: 4                  # exits on the early-exit model (M3); baselines have 1
  hidden: 64                    # width used by the dummy model and as a default for M2/M3
  # Shared temporal 1D-CNN trunk used by M2 (baselines) and M3 (early-exit). Per frame the
  # P people are flattened to features (x, y, present) -> 1x1 conv embed -> conv blocks over T.
  channels: 64                  # trunk width
  kernel_size: 3                # temporal kernel of each conv block
  num_blocks: 4                 # conv blocks in the trunk
  dropout: 0.1
  exit_after: [1, 2, 3, 4]      # M3: trunk blocks after which an exit head sits (last must be num_blocks)
  head_pool: mean               # exit head = pool over frames + one Linear (keep heads light)
  features: vel                 # per-person input: 'pos' (x,y) | 'pos+vel' | 'vel' (velocities only, orientation-free)

train:                          # M2/M3 training loop (models/train.py)
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  class_weight: balanced        # 'balanced' (inverse-frequency CE weights) or 'none'
  select_metric: bal_acc        # validation metric used to pick the best epoch (final exit)
  patience: 8                   # early stopping on select_metric; 0 disables
  device: auto                  # 'auto' | 'cpu' | 'cuda' | 'mps'
  augment_flip: true            # random pitch flips + team-slot swap per sample (teams change ends at half time)

early_exit:                     # M3 joint training + knowledge distillation
  exit_loss_weights: [0.25, 0.25, 0.25, 1.0]   # one per exit; final exit always carries full weight
  kd: true                      # distil early exits from the final head's soft outputs
  kd_alpha: 0.5                 # weight of the KD term on each early exit (vs. hard-label CE)
  kd_temperature: 2.0

prune:                          # M2 pruned baseline (physical removal via Torch-Pruning)
  ratio: 0.5                    # fraction of trunk channels removed (0.5 = half-width)
  finetune_epochs: 15

budget:
  levels: [100, 50, 20]         # battery levels the controller (M5) maps to exit thresholds

mock:                           # sizes for the mock data generator (core.mock)
  n_train: 512
  n_val: 128
  n_test: 128
  positive_fraction: 0.17       # ~1/6 positive, matching the expected imbalance at 0.5 s
